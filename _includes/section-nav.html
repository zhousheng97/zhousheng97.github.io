<nav class="site-nav">
  <div class="site-nav-inner">
    <a class="site-nav-name" href="#about-me">{{ site.title }}</a>
    <div class="site-nav-links">
      <a href="#about-me">About</a>
      <a href="#research">Research</a>
      <a href="#news">News</a>
      <a href="#publications">Publications</a>
      <a href="#services">Services</a>
      <a href="#selected-honors-and-awards">Honors</a>
    </div>
  </div>
</nav>

<script>
  // Scroll so the target heading sits just below the sticky nav bar.
  (function () {
    var nav = document.querySelector('.site-nav');
    function scrollToId(id, smooth) {
      var target = document.getElementById(id);
      if (!target) return;
      var top = target.getBoundingClientRect().top + window.pageYOffset - nav.offsetHeight - 16;
      window.scrollTo({ top: Math.max(top, 0), behavior: smooth ? 'smooth' : 'auto' });
    }
    nav.addEventListener('click', function (e) {
      var link = e.target.closest('a[href^="#"]');
      if (!link) return;
      e.preventDefault();
      var id = link.getAttribute('href').slice(1);
      history.replaceState(null, '', '#' + id);
      scrollToId(id, true);
    });
    window.addEventListener('load', function () {
      if (location.hash) scrollToId(decodeURIComponent(location.hash.slice(1)), false);
    });
  })();
</script>
